<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nana's Kitchen</title>
<style>
:root{--pink:#f7dce9;--lav:#e9e2fb;--ink:#583b57;--deep:#9b5d83;--cream:#fffafd;--line:#efd5e3}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff7fb,#f4efff);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
.app{max-width:760px;margin:auto;padding:22px 15px 40px}.hero{text-align:center;padding:25px 12px 20px;background:#ffffffb8;border:1px solid var(--line);border-radius:26px}
.logo{font-family:Georgia,serif;font-size:clamp(30px,7vw,44px);color:var(--deep);margin:0}.sub{margin:8px 0 4px;font-weight:600}.tagline{font-family:Georgia,serif;font-style:italic;color:#9b6c8d}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}.chip{border:1px solid #e6c9db;background:#fff9fc;color:#805570;border-radius:99px;padding:9px 13px;cursor:pointer;font-size:13px}.chip.active{background:var(--deep);color:white;border-color:var(--deep)}
.section-title{font: bold 21px Georgia,serif;margin:22px 2px 12px;color:#835271}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 5px 18px #7b42600d;display:flex;flex-direction:column}.photo{height:118px;display:grid;place-items:center;background:linear-gradient(135deg,#fce4ef,#e9e2fb);font-size:54px}.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.name{font-weight:750;font-size:14px;line-height:1.25;min-height:36px}.price{font-size:12px;color:#9b5d83}.choose{margin-top:auto;border:1px solid #d7b0c8;background:#fff8fc;color:#92557a;border-radius:12px;padding:10px;font-weight:700;cursor:pointer}.choose.selected{background:#92557a;color:white}
.order{position:sticky;bottom:10px;margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 10px 35px #6b38501a}.order h2{font: bold 22px Georgia,serif;margin:0 0 8px;color:#93587b}.empty{font-size:14px;color:#9d8294}.chosen{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f5e6ee;font-size:13px}.remove{border:0;background:none;color:#a56b8c;cursor:pointer}.send{width:100%;border:0;border-radius:14px;background:linear-gradient(100deg,#a9638a,#8b78bb);color:white;font-size:15px;font-weight:800;padding:14px;margin-top:13px;cursor:pointer}.fine{font-size:11px;text-align:center;color:#a1879a;margin:10px 0 0}.toast{display:none;margin-top:12px;background:#f7e9f1;padding:11px;border-radius:12px;font-size:13px;white-space:pre-wrap}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:135px}} 
</style>
</head>
<body>
<main class="app">
<header class="hero">
<p class="logo">♡ Nana’s Kitchen ♡</p>
<p class="sub">A menu for my favorite husband</p>
<p class="tagline">Choose your meal, darling. Payment is due tonight ♡</p>
</header>
<nav class="toolbar" id="filters"></nav>
<h2 class="section-title" id="categoryTitle">All the good stuff ♡</h2>
<section class="grid" id="menu"></section>
<section class="order">
<h2>♡ Your order for tomorrow</h2>
<div id="orderItems" class="empty">Choose your favorite dishes above!</div>
<button class="send" id="send">Send to Wife ❤️</button>
<p class="fine">A little food, a lot of love. ♡</p>
<div class="toast" id="toast"></div>
</section>
</main>
<script>
const dishes=[
["Japanese Chicken Curry","Asian Favorites","🍛","2 kisses 💋"],
["Ramen","Asian Favorites","🍜","1 big hug 🤗"],
["Fried Rice","Asian Favorites","🍚","1 kiss 💋"],
["Stir-Fried Noodles","Asian Favorites","🥢","2 kisses 💋💋"],
["Hot Pot","Asian Favorites","🍲","Cook together ❤️"],
["Lagman","Asian Favorites","🍜","3 kisses 💋💋💋"],
["Braised Chicken with Potatoes","Chicken & Meat","🍗","2 kisses 💋💋"],
["Stir-Fried Chicken with Mushrooms","Chicken & Meat","🍄","1 big hug 🤗"],
["Beef with Bell Peppers","Chicken & Meat","🥩","3 kisses 💋💋💋"],
["Homemade Cutlets","Chicken & Meat","🍖","2 kisses 💋💋"],
["Cola-Glazed Chicken Wings","Chicken & Meat","🍗","A kiss on the forehead 💗"],
["KFC-Style Chicken Wings","Chicken & Meat","🍗","3 kisses 💋💋💋"],
["Chicken Nuggets","Chicken & Meat","🍗","1 kiss 💋"],
["Burgers","Chicken & Meat","🍔","2 kisses 💋💋"],
["Belyash (Fried Meat Pie)","Chicken & Meat","🥟","1 big hug 🤗"],
["Pan-Fried Fish Fillet","Seafood & Dumplings","🐟","2 kisses 💋💋"],
["Chicken Dumplings","Seafood & Dumplings","🥟","1 kiss 💋"],
["Shrimp Dumplings","Seafood & Dumplings","🥟","3 kisses 💋💋💋"],
["Borscht","Soups","🍲","Kiss on the forehead 💗"],
["Egg Drop Soup","Soups","🥣","1 warm hug 🤗"],
["Homemade Meat & Potato Pasta Soup","Soups","🥣","2 kisses 💋💋"],
["Salad","Vegetables & Salads","🥗","1 kiss 💋"],
["Fried Eggplant","Vegetables & Salads","🍆","1 big hug 🤗"],
["Eggs with Soy Sauce","Vegetables & Salads","🥚","Kiss on the forehead 💗"],
["Eggs with Bell Peppers","Vegetables & Salads","🍳","1 kiss 💋"],
["Steamed Eggs","Vegetables & Salads","🍮","1 warm hug 🤗"],
["Stir-Fried Cabbage","Vegetables & Salads","🥬","1 kiss 💋"],
["Stir-Fried Green Beans","Vegetables & Salads","🫛","2 kisses 💋💋"],
["Korean-Style Carrot Salad","Vegetables & Salads","🥕","1 kiss 💋"],
["Steamed Rice","Sides & Bread","🍚","Free with love ♡"],
["Bread","Sides & Bread","🍞","Free with love ♡"],
["Pasta (Nana’s homemade style)","Homemade Specials","🍲","Kiss + hug combo 🥰"]
];
const cats=["All dishes ♡",...new Set(dishes.map(d=>d[1]))];
let active="All dishes ♡",selected=new Set();
const filters=document.getElementById("filters"),menu=document.getElementById("menu");
function renderFilters(){filters.innerHTML="";cats.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c===active?" active":"");b.textContent=c;b.onclick=()=>{active=c;renderFilters();renderMenu()};filters.append(b)})}
function renderMenu(){document.getElementById("categoryTitle").textContent=active==="All dishes ♡"?"All the good stuff ♡":active+" ♡";menu.innerHTML="";dishes.filter(d=>active==="All dishes ♡"||d[1]===active).forEach(d=>{const card=document.createElement("article");card.className="card";const photo=document.createElement("div");photo.className="photo";photo.textContent=d[2];const body=document.createElement("div");body.className="body";const name=document.createElement("div");name.className="name";name.textContent=d[0];const price=document.createElement("div");price.className="price";price.textContent="Price: "+d[3];const btn=document.createElement("button");btn.className="choose"+(selected.has(d[0])?" selected":"");btn.textContent=selected.has(d[0])?"✓ Selected ♡":"Choose ♡";btn.onclick=()=>{selected.has(d[0])?selected.delete(d[0]):selected.add(d[0]);renderMenu();renderOrder()};body.append(name,price,btn);card.append(photo,body);menu.append(card)})}
function renderOrder(){const box=document.getElementById("orderItems");if(!selected.size){box.className="empty";box.textContent="Choose your favorite dishes above!";return}box.className="";box.innerHTML="";selected.forEach(n=>{const row=document.createElement("div");row.className="chosen";const label=document.createElement("span");label.textContent="♡ "+n;const x=document.createElement("button");x.className="remove";x.textContent="Remove";x.onclick=()=>{selected.delete(n);renderMenu();renderOrder()};row.append(label,x);box.append(row)});const total=document.createElement("div");total.style.cssText="font-weight:800;margin-top:10px";total.textContent="Total dishes: "+selected.size;box.append(total)}
document.getElementById("send").onclick=()=>{const toast=document.getElementById("toast");if(!selected.size){toast.style.display="block";toast.textContent="Choose at least one dish first, darling ♡";return}toast.style.display="block";toast.textContent="Order preview ready ♡\n\n"+[...selected].map(n=>"• "+n).join("\n")+"\n\nThis demo isn't connected to Telegram yet. When connected, this order will be sent to Nana.";};
renderFilters();renderMenu();renderOrder();
</script>
</body>
</html>
